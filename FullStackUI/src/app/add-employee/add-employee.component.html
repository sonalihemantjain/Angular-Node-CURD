<div class="col-md-6 offset-md-3 mt-5">
  <h1>Test form of Node and Angular Implementation</h1>
  <hr />
  <h2>Add Employee</h2>
  <form [formGroup]="testForm">
    <div class="mb-3">
      <label for="empCode" class="form-label">Employee Code: </label>
      <input
        type="text"
        class="form-control"
        id="empCode"
        formControlName="employee_code"
      />
    </div>
    <div class="mb-3">
      <label for="name" class="form-label">Name: </label>
      <input
        type="text"
        class="form-control"
        id="name"
        formControlName="name"
      />
    </div>
    <div class="mb-3">
      <label for="salary" class="form-label">Salary: </label>
      <input
        type="text"
        class="form-control"
        id="salary"
        (keypress)="onNumericValue($event)"
        formControlName="salary"
      />
    </div>
    <div class="mb-3">
      <button class="btn btn-primary" (click)="onSubmit()">Submit</button>
      <a
        class="btn btn-warning ms-3 text-light"
        [routerLink]="['/employee-list']"
        >Employee List</a
      >
    </div>
  </form>
</div>
